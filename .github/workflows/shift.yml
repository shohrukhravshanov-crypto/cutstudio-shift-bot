name: CutStudio Shift Bot

on:
  push:
  schedule:
    - cron: "45 4 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  send-shift-message:
    runs-on: ubuntu-latest
    steps:
      - name: Test Telegram access on push
        if: github.event_name == 'push'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "BOT_TOKEN or CHANNEL secret is missing."
            exit 1
          fi

          echo "Checking bot token..."
          curl --fail --silent --show-error             --request GET             "https://api.telegram.org/bot$BOT_TOKEN/getMe"

          echo
          echo "Checking channel access..."
          curl --fail --silent --show-error             --request GET             --data-urlencode "chat_id=$CHANNEL"             "https://api.telegram.org/bot$BOT_TOKEN/getChat"

      - name: Send scheduled Telegram message
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "BOT_TOKEN or CHANNEL secret is missing."
            exit 1
          fi

          if [ "$SCHEDULE" = "45 4 * * *" ]; then
            MESSAGE=$(printf 'Доброе утро!☺️\nНаша смена началась.\nЗаказы принимаем до 21:30 (19:30 по мск).\nМожете написать по поводу заказа в @CutStudiorg.')
          else
            MESSAGE=$(printf 'Добрый вечер.\nНаша смена закончилась.\nНа все вопросы, заданные ночью мы ответим завтра.')
          fi

          curl --fail --silent --show-error             --request POST             --data-urlencode "chat_id=$CHANNEL"             --data-urlencode "text=$MESSAGE"             "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
