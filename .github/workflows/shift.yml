name: CutStudio Shift Bot

on:
  push:
  schedule:
    - cron: "45 4 * * *"
    - cron: "5 5 * * *"
    - cron: "0 7 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

jobs:
  send-shift-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL: ${{ secrets.CHANNEL }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHANNEL" ]; then
            echo "BOT_TOKEN or CHANNEL secret is missing."
            exit 1
          fi

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MESSAGE=$(printf 'Привет')
          elif [ "$SCHEDULE" = "45 4 * * *" ]; then
            MESSAGE=$(printf 'Доброе утро!☺️\nНаша смена началась.\nЗаказы принимаем до 21:30 (19:30 по мск).\nМожете написать по поводу заказа в @CutStudiorg.')
          elif [ "$SCHEDULE" = "5 5 * * *" ]; then
            MESSAGE=$(printf 'Привет')
          elif [ "$SCHEDULE" = "0 7 * * *" ]; then
            MESSAGE=$(printf 'Середина дня наступила!\nЖду первый заказ за день!')
          else
            MESSAGE=$(printf 'Добрый вечер.\nНаша смена закончилась.\nНа все вопросы, заданные ночью мы ответим завтра.')
          fi

          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=$CHANNEL" \
            --data-urlencode "text=$MESSAGE" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
